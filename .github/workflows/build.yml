name: build
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Smoke test
        shell: bash
        run: |
          python3 - <<'PY'
          import struct, math, wave
          w = wave.open("sine.wav", "wb"); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100)
          frames = b"".join(struct.pack("<hh", int(16000*math.sin(2*math.pi*1000*i/44100)), int(16000*math.sin(2*math.pi*440*i/44100))) for i in range(44100))
          w.writeframes(frames); w.close()
          PY
          exe=build/deltarec; [ -f build/Release/deltarec.exe ] && exe=build/Release/deltarec.exe
          "$exe" sine.wav -r 64 -o sine.dsf
          "$exe" sine.wav -r 256 -f dff -o sine.dff
          ls -l sine.dsf sine.dff
